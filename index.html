<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TIDA</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="TIDA">
  <meta property="og:description" content=" ">
  <meta property="og:image" content="https://ventumconsultor-stack.github.io/tida-link/tida-gerencia-whatsapp.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:url" content="https://ventumconsultor-stack.github.io/tida-link/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TIDA">
  <meta name="twitter:description" content=" ">
  <meta name="twitter:image" content="https://ventumconsultor-stack.github.io/tida-link/tida-gerencia-whatsapp.jpg">
  <style>
    html,body{margin:0;background:#05070a;min-height:100%;font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
    a.card{display:block;max-width:min(1200px,100%);text-decoration:none}
    img{display:block;width:100%;height:auto;border-radius:20px}
    .msg{color:#d9dde3;font-size:12px;margin-top:8px;text-align:center;opacity:.45}
  </style>
</head>
<body>
<main>
  <div>
    <a class="card" id="card" href="#" aria-label="Abrir TIDA">
      <img src="tida-gerencia-whatsapp.jpg" alt="TIDA Gerencia · Pizzería Don Álvaro">
    </a>
    <div class="msg" id="msg">TIDA</div>
  </div>
</main>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const to=p.get('to');
  const card=document.getElementById('card');
  const msg=document.getElementById('msg');
  if(!to){card.removeAttribute('href');msg.textContent='TIDA';return;}
  try{
    const u=new URL(to);
    if(u.protocol==='https:' && u.hostname==='sicog-vr.streamlit.app'){
      card.href=u.href;
      msg.textContent='';
      setTimeout(()=>location.replace(u.href),350);
      return;
    }
  }catch(e){}
  card.removeAttribute('href');
  msg.textContent='Enlace TIDA no válido';
})();
</script>
</body>
</html>
