<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TIDA</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="TIDA">
  <meta property="og:description" content=" ">
  <meta property="og:image" content="https://ventumconsultor-stack.github.io/tida-link/tida-gerencia.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://ventumconsultor-stack.github.io/tida-link/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TIDA">
  <meta name="twitter:description" content=" ">
  <meta name="twitter:image" content="https://ventumconsultor-stack.github.io/tida-link/tida-gerencia.png">
  <style>
    html,body{margin:0;background:#05070a;min-height:100%;font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
    img{display:block;max-width:min(1200px,100%);height:auto;border-radius:20px}
    .msg{color:#d9dde3;font-size:14px;margin-top:12px;text-align:center;opacity:.75}
  </style>
</head>
<body>
<main>
  <div>
    <img src="tida-gerencia.png" alt="TIDA Gerencia · Pizzería Don Álvaro">
    <div class="msg" id="msg">Abriendo acceso…</div>
  </div>
</main>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const to=p.get('to');
  if(!to){document.getElementById('msg').textContent='TIDA · enlace de acceso';return;}
  try{
    const u=new URL(to);
    if(u.protocol==='https:' && u.hostname==='sicog-vr.streamlit.app'){
      location.replace(u.href);
      return;
    }
  }catch(e){}
  document.getElementById('msg').textContent='Enlace TIDA no válido';
})();
</script>
</body>
</html>
